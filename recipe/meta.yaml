{% set version = "2.5.2" %}

package:
    name: mkl-service
    version: {{ version }}

source:
    url: https://github.com/IntelPython/mkl-service/archive/v{{ version }}.post0.tar.gz
    sha256: ee5506eb95ff1f4d67cd5f3e5b4648d752900dd10af8219f9b3857b306945a56
    patches:
      - patches/0001-Conditional-mpich2.patch

build:
    skip: True  # [not x86 or osx]
    number: 0
    ignore_run_exports:
      - blas
      - mkl-service

requirements:
    build:
      - {{ compiler('c') }}
      - patch     # [unix]
      - m2-patch  # [win]
    host:
      - python
      - setuptools
      - mkl-devel {{ mkl }}
      - cython
    run:
      - python
      - mkl

test:
    # nose is incompatible with python 3.12
    requires:               # [py<312]
      - nose                # [py<312]
      - six                 # [py<312]
    imports:
      - mkl
    commands:               # [py<312]
      - nosetests -v tests  # [py<312]
    source_files:           # [py<312]
      - tests               # [py<312]

about:
    home: https://github.com/IntelPython/mkl-service
    license: BSD-3-Clause
    license_file: LICENSE.txt
    license_family: BSD
    description:
        Intel(R) Math Kernel Library (Intel(R) MKL) support functions are
        subdivided into the following groups according to their purpose, such as
            Version Information
            Threading Control
            Timing
            Memory Management
            Conditional Numerical Reproducibility Control
            Miscellaneous
    summary: Python hooks for Intel(R) Math Kernel Library runtime control settings.
    dev_url: https://github.com/IntelPython/mkl-service
    doc_url: https://github.com/IntelPython/mkl-service

extra:
  skip-lints:
    - cbc_dep_in_run_missing_from_host
  recipe-maintainers:
     - oleksandr-pavlyk
